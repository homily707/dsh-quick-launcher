name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const [pkg] = JSON.parse(readFileSync('/tmp/pack.json','utf8'));
            for (const p of ['index.js','client.js','cordis.patch.yml','icon.svg','package.json']) {
              if (!pkg.files.some(f => f.path === p)) throw new Error('Missing npm file: ' + p);
            }
          "

      - name: Publish to npm using OIDC
        run: npm publish --access public
